name: claude-kit-ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install packaging test dependencies
        run: python -m pip install "setuptools>=68" wheel

      - name: Install package in editable mode
        run: python -m pip install --no-deps --editable .

      - name: Compile sources
        env:
          # runner context is available at step scope; keep snapshots pristine.
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/claude-kit-pycache
        run: python -m compileall -q src bin

      - name: Run tests
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/claude-kit-pycache
        run: python -m unittest discover -s tests -v

      - name: Verify RTL and DV packet routing on POSIX
        # Run the POSIX packet router with its real fcntl locking dependency.
        if: runner.os == 'Linux'
        run: python -B -m unittest discover -s src/claude_kit/resources/framework/soc/.claude/scripts/tests -p test_loop_context.py -v

      - name: Smoke installed CLI
        run: |
          claude-kit version
          claude-kit list roles --json
          claude-kit list packs --json
          claude-kit list skills --json
          claude-kit list workflows --json
          claude-kit plan --project-root tests/fixtures/minimal_project --task "debug APB timeout" --json
