name: claude-kit-ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package in editable mode
        run: python -m pip install --no-deps --editable .

      - name: Compile sources
        run: python -m compileall -q src bin

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Smoke installed CLI
        run: |
          claude-kit version
          claude-kit list roles --json
          claude-kit list packs --json
          claude-kit list skills --json
          claude-kit list workflows --json
          claude-kit plan --project-root tests/fixtures/minimal_project --task "debug APB timeout" --json
