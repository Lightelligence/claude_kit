schema_version = 1

packs = ["common"]

[project]
id = "replace-me"
display_name = "Replace me"
root = "."
language = "systemverilog"
platform = "linux"

[roots]
hw = ["hw"]
rtl = ["rtl"]
dv = ["dv"]
testbench = ["tb"]
docs = ["docs"]
vendor = ["third_party_vip"]
generated = ["generated", "out"]

[roles]
defaults = ["rtl-designer", "dv-engineer", "reviewer"]

[build]
system = "project-wrapper"
simulator = "project-configured"
# Optional runtime facts used by `claude-kit plan`:
# target = "top_or_target"
# test_selector = "focused_test_or_suite"

[build.commands]

[vip]

# Optional project adapter:
# [adapter]
# path = ".ai/adapter.py"
# required_functions = ["resolve_target", "resolve_test"]

[permissions]
writable = ["hw/**", "rtl/**", "dv/**", "tb/**", "docs/**", ".ai/overrides/**"]
deletable = []
read_only = ["third_party_vip/**", "generated/**", "out/**"]
forbidden = [".git/**", "secrets/**"]

[artifacts]
logs = "out/logs"
reports = "out/reports"
waveforms = "out/waves"
coverage = "out/coverage"

# Optional external regression artifacts. The consumer checkout must provide
# its own root and naming rules; do not copy another project's path or test
# alias into this generic template.
# [artifacts.regression]
# root = "/nfs/regression/<user>/<checkout-name>"
# compile_directory_pattern = "*__VCS_VCOMP"
# compile_log_names = ["cmp.log"]
# compile_lock_suffix = ".compile.lock"
# simulation_directory_pattern = "*__vcs__*"
# simulation_primary_log_names = ["sim.log", "run.log", "test.log"]
# simulation_log_glob = "*.log"
# simulation_lock_suffix = ".run.lock"

[policies]
require_evidence = true
network = "disabled"
auto_commit = false
auto_push = false
